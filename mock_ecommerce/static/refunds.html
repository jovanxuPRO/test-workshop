<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>退款管理 — E-Commerce</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="nav">
<a href="/" class="nav-brand">E-Commerce v2.0</a>
<ul class="nav-links">
<li><a href="/">Dashboard</a></li>
<li><a href="/products">商品管理</a></li>
<li><a href="/orders">订单管理</a></li>
<li><a href="/refunds" class="active">退款管理</a></li>
</ul>
<div class="nav-user"><span id="nav-user-name"></span><button onclick="logout()">退出</button></div>
</nav>
<div class="container">
<div class="card">
<div class="card-header">
<h2>退款列表</h2>
<button class="btn btn-primary" onclick="showCreateRefund()">+ 申请退款</button>
</div>
<table><thead><tr><th>退款单号</th><th>关联订单</th><th>原因</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
<tbody id="refund-list"></tbody></table>
</div>
</div>
<!-- Create Refund Dialog -->
<div class="dialog-overlay" id="create-dialog" style="display:none" onclick="if(event.target===this)dialog('hide','create-dialog')">
<div class="dialog">
<h3>申请退款</h3>
<div class="form-group"><label>订单ID</label><input id="refund-oid" placeholder="如 o001"></div>
<div class="form-group"><label>退款金额 (留空退全额)</label><input id="refund-amount" type="number" step="0.01" min="0.01" placeholder="留空退全额"></div>
<div class="form-group"><label>退款原因</label><input id="refund-reason" placeholder="质量问题/描述不符/其他"></div>
<div class="flex" style="justify-content:flex-end;gap:8px;margin-top:20px">
<button class="btn btn-outline" onclick="dialog('hide','create-dialog')">取消</button>
<button class="btn btn-primary" onclick="submitRefund()">提交</button>
</div>
</div>
</div>
<script src="/static/app.js"></script>
<script>
var _user={};checkAuth();_user=JSON.parse(localStorage.getItem('user')||'{}');load();
function dialog(a,id){document.getElementById(id).style.display=a==='show'?'flex':'none'}
async function load(){
try{var r=await API.get('/api/refunds');var d=await r.json();
var rows='',badges={pending:'badge-warning',approved:'badge-success',rejected:'badge-danger'},cnames={pending:'待审批',approved:'已通过',rejected:'已驳回'};
d.forEach(function(rf){rows+='<tr><td style="font-family:monospace;font-size:11px">'+rf.id+'</td><td style="font-family:monospace;font-size:11px">'+rf.order_id+'</td><td>'+trunc(rf.reason,30)+'</td><td style="font-weight:600">'+formatMoney(rf.amount)+'</td><td><span class="badge '+(badges[rf.status]||'')+'">'+(cnames[rf.status]||rf.status)+'</span></td><td>'+formatDate(rf.created)+'</td><td class="flex">'+
(_user.role==='admin'&&rf.status==='pending'?'<button class="btn btn-success btn-sm" onclick="approve(\''+rf.id+'\')">通过</button><button class="btn btn-danger btn-sm" onclick="reject(\''+rf.id+'\')">驳回</button>':'')
+'</td></tr>'});document.getElementById('refund-list').innerHTML=rows||'<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">暂无退款记录</td></tr>'}}catch(e){if(e.message!=='401')console.error(e)}
}
function showCreateRefund(){document.getElementById('refund-oid').value='';document.getElementById('refund-amount').value='';document.getElementById('refund-reason').value='';dialog('show','create-dialog')}
async function submitRefund(){
var oid=document.getElementById('refund-oid').value,amount=document.getElementById('refund-amount').value,reason=document.getElementById('refund-reason').value;
if(!oid){toast('请输入订单ID','error');return}
var body={order_id:oid,reason:reason};if(amount)body.amount=parseFloat(amount);
try{var r=await API.post('/api/refunds',body);if(r.ok){toast('退款申请已提交','success');dialog('hide','create-dialog');load()}else{var d=await r.json();toast(d.detail||'申请失败','error')}}catch(e){toast(e.message,'error')}
}
async function approve(id){try{var r=await API.put('/api/refunds/'+id+'/approve');if(r.ok){toast('退款已通过','success');load()}else{var d=await r.json();toast(d.detail,'error')}}catch(e){toast(e.message,'error')}}
async function reject(id){try{var r=await API.put('/api/refunds/'+id+'/reject');if(r.ok){toast('退款已驳回','success');load()}else{var d=await r.json();toast(d.detail,'error')}}catch(e){toast(e.message,'error')}}
</script>
</body>
</html>
