<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Commerce Order System v2.0</title>
<style>
*,::after,::before{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#4F46E5;--bg:#F1F5F9;--card:#FFF;--text:#1E293B;--muted:#64748B;--border:#E2E8F0}
body{font-family:Inter,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:220px;background:linear-gradient(180deg,#1E293B,#0F172A);color:#CBD5E1;padding:24px 0;position:fixed;top:0;left:0;bottom:0;z-index:10;display:flex;flex-direction:column}
.sidebar-brand{padding:0 20px 24px;font-size:18px;font-weight:700;color:#E2E8F0;border-bottom:1px solid #334155;margin-bottom:12px}
.sidebar-brand span{font-size:11px;color:#64748B;display:block;margin-top:2px;font-weight:400}
.sidebar-nav{flex:1;padding:0 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;transition:.15s;margin:2px 0;color:#94A3B8;text-decoration:none}
.nav-item:hover{background:#1E293B;color:#E2E8F0}
.nav-item.active{background:#4F46E5;color:#FFF}
.nav-item .icon{font-size:18px;width:24px;text-align:center}
.nav-item .badge{background:#EF4444;color:#FFF;font-size:10px;padding:1px 7px;border-radius:10px;margin-left:auto}
.sidebar-footer{padding:12px 20px;border-top:1px solid #334155;font-size:12px;color:#64748B}
.sidebar-footer button{background:transparent;color:#94A3B8;border:1px solid #334155;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;width:100%;margin-top:8px}
.sidebar-footer button:hover{color:#EF4444;border-color:#EF4444}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:flex-end;position:sticky;top:0;z-index:5}
.topbar span{font-size:13px;color:var(--muted)}
.page{padding:24px;display:none;flex:1}
.page.active{display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:20px}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:30px;font-weight:700}
.stat .s{font-size:12px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:24px;margin-bottom:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.card-h h2{font-size:18px;font-weight:600}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#FFF}
.btn-success{background:#059669;color:#FFF}
.btn-danger{background:#DC2626;color:#FFF}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--bg)}
.btn-sm{padding:5px 12px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:hover{background:#F8FAFC}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
.bg-green{background:#D1FAE5;color:#065F46}.bg-yellow{background:#FEF3C7;color:#92400E}
.bg-blue{background:#DBEAFE;color:#1E40AF}.bg-red{background:#FEE2E2;color:#991B1B}
.bg-purple{background:#EDE9FE;color:#5B21B6}.bg-gray{background:#F1F5F9;color:#475569}
input,select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card)}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.modal-box{background:#FFF;border-radius:16px;padding:32px;width:560px;max-width:90vw;max-height:80vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-box h3{font-size:18px;margin-bottom:20px}
.flex{display:flex;gap:8px;align-items:center}.flex-between{justify-content:space-between}.flex-end{justify-content:flex-end}
.mb{margin-bottom:16px}.mt{margin-top:16px}.fw{width:100%}
.fg{display:flex;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tab{padding:8px 16px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--muted);transition:.15s}
.tab:hover,.tab.active{background:#EEF2FF;color:var(--primary);border-color:var(--primary)}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--border)}
.timeline-item{position:relative;padding:8px 0}
.timeline-item::before{content:'';position:absolute;left:-20px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--border)}
.timeline-item.done::before{background:var(--primary)}
.timeline-item.current::before{background:#F59E0B;box-shadow:0 0 0 4px rgba(245,158,11,.2)}
.timeline-item .ts{font-size:11px;color:var(--muted)}.timeline-item .tl{font-size:13px;font-weight:500}
.loading{text-align:center;padding:40px;color:var(--muted)}.loading::after{content:'...';animation:dots 1.5s infinite}
@keyframes dots{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:200;color:#FFF;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.search-box{width:260px}
.num{font-family:monospace;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<!-- Sidebar -->
<div class="sidebar">
<div class="sidebar-brand">E-Commerce<span>Order System v2.0</span></div>
<div class="sidebar-nav">
<a class="nav-item active" onclick="nav('dashboard')"><span class="icon">📊</span> Dashboard</a>
<a class="nav-item" onclick="nav('products')"><span class="icon">📦</span> 商品管理</a>
<a class="nav-item" onclick="nav('orders')"><span class="icon">📋</span> 订单管理<span class="badge" id="nav-pending" style="display:none">0</span></a>
<a class="nav-item" onclick="nav('refunds')"><span class="icon">↩</span> 退款管理<span class="badge" id="nav-refund-badge" style="display:none">0</span></a>
</div>
<div class="sidebar-footer">
<div id="sidebar-user" style="margin-bottom:4px"></div>
<button onclick="logout()">退出登录</button>
</div>
</div>

<!-- Main -->
<div class="main">
<div class="topbar"><span id="topbar-time"></span></div>

<!-- Dashboard -->
<div class="page active" id="page-dashboard">
<div class="stats" id="dash-stats"></div>
<div class="card"><div class="card-h"><h2>订单状态分布</h2></div><div class="fg" id="status-chart"></div></div>
<div class="card"><div class="card-h"><h2>低库存预警</h2></div><div id="low-stock" class="loading"></div></div>
</div>

<!-- Products -->
<div class="page" id="page-products">
<div class="card">
<div class="card-h"><h2>商品列表</h2>
<div class="flex"><input class="search-box" id="prod-search" placeholder="搜索商品..." oninput="loadProducts()">
<select id="prod-cat" onchange="loadProducts()" style="width:130px"><option value="">全部分类</option><option>外设</option><option>显示</option><option>家具</option><option>配件</option></select>
<button class="btn btn-primary" onclick="showProductModal()">+ 新增</button></div></div>
<table><thead><tr><th>ID</th><th>名称</th><th>分类</th><th>价格</th><th>库存</th><th>操作</th></tr></thead><tbody id="prod-list"></tbody></table>
<div class="flex flex-end mt" id="prod-pager"></div>
</div>
</div>

<!-- Orders -->
<div class="page" id="page-orders">
<div class="card">
<div class="card-h"><h2>订单列表</h2><button class="btn btn-primary" onclick="showCreateOrder()">+ 创建订单</button></div>
<div class="tabs" id="order-tabs"><button class="tab active" onclick="filterOrders('')">全部</button></div>
<table><thead><tr><th>订单号</th><th>内容</th><th>金额</th><th>状态</th><th>时间</th><th></th></tr></thead><tbody id="order-list"></tbody></table>
<div class="flex flex-end mt" id="order-pager"></div>
</div>
</div>

<!-- Refunds -->
<div class="page" id="page-refunds">
<div class="card">
<div class="card-h"><h2>退款管理</h2><button class="btn btn-primary" onclick="showRefundModal()">+ 申请退款</button></div>
<table><thead><tr><th>退款单号</th><th>订单</th><th>原因</th><th>金额</th><th>状态</th><th>时间</th><th></th></tr></thead><tbody id="refund-list"></tbody></table>
</div>
</div>
</div>

<!-- Product Modal -->
<div class="modal" id="prod-modal">
<div class="modal-box"><h3 id="prod-modal-title">新增商品</h3>
<input type="hidden" id="prod-edit-id">
<div class="mb"><label style="font-size:12px;color:var(--muted)">商品名称</label><input id="prod-name" placeholder="机械键盘 K8 Pro"></div>
<div class="mb"><label style="font-size:12px;color:var(--muted)">价格</label><input id="prod-price" type="number" step="0.01" min="0.01" value="99"></div>
<div class="mb"><label style="font-size:12px;color:var(--muted)">库存</label><input id="prod-stock" type="number" min="0" value="50"></div>
<div class="mb"><label style="font-size:12px;color:var(--muted)">分类</label><select id="prod-cat2"><option>外设</option><option>显示</option><option>家具</option><option>配件</option><option>未分类</option></select></div>
<div class="flex flex-end"><button class="btn btn-outline" onclick="hideModal('prod-modal')">取消</button><button class="btn btn-primary" onclick="saveProduct()">保存</button></div>
</div></div>

<!-- Order Detail Modal -->
<div class="modal" id="order-modal"><div class="modal-box" id="order-detail"></div></div>

<!-- Create Order Modal -->
<div class="modal" id="create-order-modal">
<div class="modal-box"><h3>创建订单</h3>
<div id="create-order-items" class="loading"></div>
<div class="flex flex-between mt"><strong>合计: <span id="create-total" style="color:var(--primary);font-size:20px">¥0.00</span></strong>
<div class="flex"><button class="btn btn-outline" onclick="hideModal('create-order-modal')">取消</button><button class="btn btn-primary" onclick="submitOrder()">提交订单</button></div></div>
</div></div>

<!-- Refund Modal -->
<div class="modal" id="refund-modal">
<div class="modal-box"><h3>申请退款</h3>
<div class="mb"><label style="font-size:12px;color:var(--muted)">订单ID</label><input id="refund-oid" placeholder="如 o001"></div>
<div class="mb"><label style="font-size:12px;color:var(--muted)">金额 (留空退全额)</label><input id="refund-amount" type="number" step="0.01" placeholder="留空退全额"></div>
<div class="mb"><label style="font-size:12px;color:var(--muted)">原因</label><input id="refund-reason" placeholder="质量问题/描述不符"></div>
<div class="flex flex-end"><button class="btn btn-outline" onclick="hideModal('refund-modal')">取消</button><button class="btn btn-primary" onclick="submitRefund()">提交</button></div>
</div></div>

<!-- Login -->
<div id="login-page" style="display:none;position:fixed;inset:0;background:linear-gradient(135deg,#1E293B,#0F172A);align-items:center;justify-content:center;z-index:300">
<div style="background:#FFF;border-radius:16px;padding:40px;width:400px;max-width:90vw;text-align:center">
<h1 style="margin-bottom:4px">E-Commerce</h1><p style="color:var(--muted);font-size:13px;margin-bottom:24px">企业订单管理系统</p>
<div class="mb" style="text-align:left"><label style="font-size:12px;color:var(--muted)">用户名</label><input id="login-user" value="admin" autocomplete="off"></div>
<div class="mb" style="text-align:left"><label style="font-size:12px;color:var(--muted)">密码</label><input id="login-pass" type="password" value="Admin@123"></div>
<button class="btn btn-primary fw" onclick="doLogin()" style="justify-content:center;padding:12px">登 录</button>
<p style="color:var(--muted);font-size:11px;margin-top:16px">预置账号: admin/Admin@123 · operator/Oper@123 · viewer/View@123</p>
</div></div>

<script>
// ===== Auth =====
var token='',user={};
function checkAuth(){token=localStorage.getItem('token');if(!token){document.getElementById('login-page').style.display='flex';return false}user=JSON.parse(localStorage.getItem('user')||'{}');document.getElementById('sidebar-user').textContent=(user.name||user.username)+' ('+user.role+')';document.getElementById('topbar-time').textContent=new Date().toLocaleString('zh-CN');return true}
async function doLogin(){var u=document.getElementById('login-user').value,p=document.getElementById('login-pass').value;try{var r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});var d=await r.json();if(!r.ok)throw new Error(d.detail||'登录失败');localStorage.setItem('token',d.token);localStorage.setItem('user',JSON.stringify(d.user));document.getElementById('login-page').style.display='none';checkAuth();nav('dashboard');loadDashboard()}catch(e){toast(e.message,'error')}}
function logout(){localStorage.removeItem('token');localStorage.removeItem('user');document.getElementById('login-page').style.display='flex'}

// ===== API =====
var API={headers:function(b){var h=b?{'Content-Type':'application/json'}:{};if(token)h['Authorization']='Bearer '+token;return h},
get:async function(u){var r=await fetch(u,{headers:API.headers()});if(r.status===401){logout();throw new Error('401')}return r},
post:async function(u,b){var r=await fetch(u,{method:'POST',headers:API.headers(true),body:JSON.stringify(b)});if(r.status===401){logout();throw new Error('401')}return r},
put:async function(u,b){var r=await fetch(u,{method:'PUT',headers:API.headers(true),body:b?JSON.stringify(b):undefined});if(r.status===401){logout();throw new Error('401')}return r},
del:async function(u){var r=await fetch(u,{method:'DELETE',headers:API.headers()});if(r.status===401){logout();throw new Error('401')}return r}};

// ===== Nav =====
function nav(page){
document.querySelectorAll('.nav-item').forEach(function(a){a.classList.toggle('active',a.textContent.includes({dashboard:'Dashboard',products:'商品',orders:'订单',refunds:'退款'}[page]))});
document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
document.getElementById('page-'+page).classList.add('active');
if(page==='dashboard')loadDashboard();if(page==='products')loadProducts();if(page==='orders')loadOrders();if(page==='refunds')loadRefunds();
}
function showModal(id){document.getElementById(id).classList.add('show')}
function hideModal(id){document.getElementById(id).classList.remove('show')}
function toast(msg,type){var t=document.createElement('div');t.className='toast';t.style.background=type==='success'?'#059669':type==='error'?'#DC2626':'#4F46E5';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},3000)}
function F(n){return'¥'+Number(n).toFixed(2)}
function D(s){return new Date(s).toLocaleDateString('zh-CN')}
function T(s,n){return(s||'').length>n?s.slice(0,n)+'...':s}
var _cacheProducts=[];

// ===== Dashboard =====
async function loadDashboard(){
try{var r=await API.get('/api/stats');var d=await r.json(),h='';
h+='<div class="stat"><div class="l">总商品</div><div class="v">'+d.total_products+'</div><div class="s">件</div></div>';
h+='<div class="stat"><div class="l">总订单</div><div class="v">'+d.total_orders+'</div><div class="s">单</div></div>';
h+='<div class="stat"><div class="l">总收入</div><div class="v">'+F(d.total_revenue)+'</div><div class="s"></div></div>';
h+='<div class="stat"><div class="l">待退款</div><div class="v">'+d.pending_refunds+'</div><div class="s">'+F(d.pending_refund_amount)+'</div></div>';
h+='<div class="stat"><div class="l">低库存</div><div class="v">'+d.low_stock_products.length+'</div><div class="s">件商品</div></div>';
document.getElementById('dash-stats').innerHTML=h;
var ns={'created':'待确认','confirmed':'已确认','paid':'已支付','shipped':'已发货','delivered':'已完成','cancelled':'已取消'};
var cs={'created':'#93C5FD','confirmed':'#60A5FA','paid':'#3B82F6','shipped':'#8B5CF6','delivered':'#059669','cancelled':'#9CA3AF'};
var mx=Math.max.apply(null,Object.values(d.orders_by_status))||1,ch='';
Object.entries(d.orders_by_status).forEach(function(e){ch+='<div style="flex:1;text-align:center"><div style="background:'+cs[e[0]]+';height:'+Math.round(e[1]/mx*120)+'px;border-radius:4px 4px 0 0;min-height:4px"></div><div style="font-size:10px;color:var(--muted);margin-top:6px">'+ns[e[0]]+'</div><div style="font-size:14px;font-weight:600">'+e[1]+'</div></div>'});
document.getElementById('status-chart').innerHTML=ch;
var ls=d.low_stock_products.length?d.low_stock_products.map(function(n){return'<span class="badge bg-red" style="margin:2px">'+n+'</span>'}).join(' '):'无';
document.getElementById('low-stock').innerHTML=ls;
}catch(e){if(e.message!=='401')console.error(e)}
}

// ===== Products =====
var _prodPage=1;
async function loadProducts(){
try{var p='?page='+_prodPage+'&limit=15',s=document.getElementById('prod-search').value,c=document.getElementById('prod-cat').value;
if(s)p+='&search='+encodeURIComponent(s);if(c)p+='&category='+encodeURIComponent(c);
var r=await API.get('/api/products'+p);var d=await r.json();_cacheProducts=d.data;
var rows='';d.data.forEach(function(p){rows+='<tr><td class="num">'+p.id+'</td><td><strong>'+T(p.name,30)+'</strong></td><td><span class="badge bg-blue">'+p.category+'</span></td><td style="font-weight:600">'+F(p.price)+'</td><td>'+(p.stock<20?'<span style="color:#DC2626;font-weight:600">'+p.stock+'</span>':p.stock)+'</td><td class="flex">'+(user.role!=='viewer'?'<button class="btn btn-outline btn-sm" onclick="editProduct(\''+p.id+'\')">编辑</button>'+'<button class="btn btn-outline btn-sm" style="color:#DC2626" onclick="delProduct(\''+p.id+'\')">删除</button>':'')+'</td></tr>'});document.getElementById('prod-list').innerHTML=rows||'<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">暂无商品</td></tr>';
var ph='',pages=Math.ceil(d.total/15);for(var i=1;i<=pages;i++)ph+='<button class="btn btn-outline btn-sm'+(i===_prodPage?' active':'')+'" onclick="_prodPage='+i+';loadProducts()" style="'+(i===_prodPage?'background:var(--primary);color:#FFF;border-color:var(--primary)':'')+'">'+i+'</button>';document.getElementById('prod-pager').innerHTML=ph}catch(e){if(e.message!=='401')console.error(e)}
}
function showProductModal(id){hideModal('prod-modal');document.getElementById('prod-modal-title').textContent=id?'编辑商品':'新增商品';document.getElementById('prod-edit-id').value='';document.getElementById('prod-name').value='';document.getElementById('prod-price').value='99';document.getElementById('prod-stock').value='50';document.getElementById('prod-cat2').value='未分类';if(id)editProduct(id);showModal('prod-modal')}
async function editProduct(id){try{var r=await API.get('/api/products/'+id);var p=await r.json();document.getElementById('prod-edit-id').value=p.id;document.getElementById('prod-name').value=p.name;document.getElementById('prod-price').value=p.price;document.getElementById('prod-stock').value=p.stock;document.getElementById('prod-cat2').value=p.category}catch(e){}}
async function saveProduct(){var id=document.getElementById('prod-edit-id').value,body={name:document.getElementById('prod-name').value,price:parseFloat(document.getElementById('prod-price').value),stock:parseInt(document.getElementById('prod-stock').value),category:document.getElementById('prod-cat2').value};try{var r;if(id)r=await API.put('/api/products/'+id,body);else r=await API.post('/api/products',body);if(r.ok){hideModal('prod-modal');loadProducts();toast(id?'已更新':'已创建','success')}else{var d=await r.json();toast(d.detail||'操作失败','error')}}catch(e){toast(e.message,'error')}}
async function delProduct(id){if(!confirm('确定删除 '+id+'?'))return;await API.del('/api/products/'+id);loadProducts();toast('已删除','success')}

// ===== Orders =====
var _orderPage=1,_orderStatus='';
async function loadOrders(){
try{var p='?page='+_orderPage+'&limit=15';if(_orderStatus)p+='&status='+_orderStatus;
var r=await API.get('/api/orders'+p);var d=await r.json();
var bs={created:'bg-blue',confirmed:'bg-purple',paid:'bg-yellow',shipped:'bg-blue',delivered:'bg-green',cancelled:'bg-gray'},ns={created:'待确认',confirmed:'已确认',paid:'已支付',shipped:'已发货',delivered:'已完成',cancelled:'已取消'};
var cnt={};d.data.forEach(function(o){cnt[o.status]=(cnt[o.status]||0)+1});
var tabs='<button class="tab'+(!_orderStatus?' active':'')+'" onclick="filterOrders(\'\')">全部 ('+d.total+')</button>';
['created','confirmed','paid','shipped','delivered','cancelled'].forEach(function(s){tabs+='<button class="tab'+(_orderStatus===s?' active':'')+'" onclick="filterOrders(\''+s+'\')">'+ns[s]+' ('+(cnt[s]||0)+')</button>'});
document.getElementById('order-tabs').innerHTML=tabs;
document.getElementById('nav-pending').textContent=(cnt.created||0)+(cnt.confirmed||0);
document.getElementById('nav-pending').style.display=((cnt.created||0)+(cnt.confirmed||0))?'inline':'none';
var rows='';d.data.forEach(function(o){var items=o.items.map(function(i){return i.quantity+'x '+i.product_id}).join(', ');
rows+='<tr><td class="num">'+o.id+'</td><td>'+T(items,40)+'</td><td style="font-weight:600">'+F(o.total)+'</td><td><span class="badge '+bs[o.status]+'">'+ns[o.status]+'</span></td><td>'+D(o.created)+'</td><td><button class="btn btn-outline btn-sm" onclick="showOrderDetail(\''+o.id+'\')">详情</button></td></tr>'});document.getElementById('order-list').innerHTML=rows||'<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">暂无订单</td></tr>';
var ph='',pages=Math.ceil(d.total/15);for(var i=1;i<=pages;i++)ph+='<button class="btn btn-outline btn-sm" onclick="_orderPage='+i+';loadOrders()" style="'+(i===_orderPage?'background:var(--primary);color:#FFF;border-color:var(--primary)':'')+'">'+i+'</button>';document.getElementById('order-pager').innerHTML=ph}catch(e){if(e.message!=='401')console.error(e)}
}
function filterOrders(s){_orderStatus=s;_orderPage=1;loadOrders()}

async function showCreateOrder(){
try{var r=await API.get('/api/products?limit=100');var pd=await r.json();_cacheProducts=pd.data;
var rows='<table><thead><tr><th>商品</th><th>价格</th><th>库存</th><th>数量</th></tr></thead><tbody>';
pd.data.forEach(function(p){rows+='<tr><td><strong>'+T(p.name,22)+'</strong> <span class="badge bg-blue">'+p.category+'</span></td><td>'+F(p.price)+'</td><td>'+(p.stock<10?'<span style="color:#DC2626">'+p.stock+'</span>':p.stock)+'</td><td><input type="number" min="0" max="'+p.stock+'" value="0" style="width:70px" onchange="updateCart(\''+p.id+'\','+p.price+',this.value)"></td></tr>'});rows+='</tbody></table>';
document.getElementById('create-order-items').innerHTML=rows;document.getElementById('create-total').textContent='¥0.00';window._cart={};showModal('create-order-modal')}catch(e){toast(e.message,'error')}}
function updateCart(pid,price,qty){qty=parseInt(qty)||0;if(qty>0)window._cart[pid]=qty;else delete window._cart[pid];var t=Object.entries(window._cart).reduce(function(s,e){var p=_cacheProducts.find(function(x){return x.id===e[0]});return s+(p?p.price*e[1]:0)},0);document.getElementById('create-total').textContent=F(t)}
async function submitOrder(){var items=Object.entries(window._cart).map(function(e){return{product_id:e[0],quantity:e[1]}});if(!items.length){toast('请选择商品','error');return}
try{var r=await API.post('/api/orders',{items:items});if(r.ok){var d=await r.json();toast('订单 '+d.id+' 创建成功','success');hideModal('create-order-modal');loadOrders();loadDashboard()}else{var d=await r.json();toast(d.detail||'创建失败','error')}}catch(e){toast(e.message,'error')}}

async function showOrderDetail(id){
try{var r=await API.get('/api/orders/'+id);var o=await r.json();var bs={created:'bg-blue',confirmed:'bg-purple',paid:'bg-yellow',shipped:'bg-blue',delivered:'bg-green',cancelled:'bg-gray'},ns={created:'待确认',confirmed:'已确认',paid:'已支付',shipped:'已发货',delivered:'已完成',cancelled:'已取消'};
var items=o.items.map(function(i){return'<tr><td>'+i.product_id+'</td><td>'+i.quantity+'</td><td>'+F(i.unit_price)+'</td><td>'+F(i.unit_price*i.quantity)+'</td></tr>'}).join('');
var order=['created','confirmed','paid','shipped','delivered'];
var tl='',passed=true;
order.forEach(function(s){var cls=o.status===s?'current':passed?'done':'';if(o.status===s)passed=false;if(s==='cancelled'&&o.status==='cancelled')cls='current';tl+='<div class="timeline-item'+(cls?' '+cls:'')+'"><div class="tl">'+ns[s]+'</div></div>'});
if(o.status==='cancelled'){tl='<div class="timeline-item current"><div class="tl">已取消</div><div class="ts">'+o.updated+'</div></div>'}
var trs={created:['confirmed','cancelled'],confirmed:['paid','cancelled'],paid:['shipped'],shipped:['delivered'],delivered:[],cancelled:[]};
var btns='';if(user.role!=='viewer')trs[o.status].forEach(function(t){btns+='<button class="btn btn-primary btn-sm" onclick="transitionOrder(\''+o.id+'\',\''+t+'\')">'+{confirmed:'确认',paid:'支付',shipped:'发货',delivered:'完成',cancelled:'取消'}[t]+'</button> '});
document.getElementById('order-detail').innerHTML='<h3>订单 '+o.id+'</h3><div class="stats" style="margin-bottom:16px"><div class="stat"><div class="l">状态</div><div class="v" style="font-size:18px"><span class="badge '+bs[o.status]+'">'+ns[o.status]+'</span></div></div><div class="stat"><div class="l">金额</div><div class="v">'+F(o.total)+'</div></div><div class="stat"><div class="l">创建</div><div class="v" style="font-size:13px">'+D(o.created)+'</div></div></div><div class="flex" style="gap:24px"><div style="flex:1"><strong style="font-size:14px">订单商品</strong><table style="margin-top:8px"><thead><tr><th>ID</th><th>数量</th><th>单价</th><th>小计</th></tr></thead><tbody>'+items+'</tbody></table></div><div style="width:180px"><strong style="font-size:14px">进度</strong><div class="timeline" style="margin-top:8px">'+tl+'</div></div></div><div class="flex flex-end mt">'+btns+'<button class="btn btn-outline btn-sm" onclick="hideModal(\'order-modal\')">关闭</button></div>';
showModal('order-modal')}catch(e){toast(e.message,'error')}}
async function transitionOrder(id,status){
var ns={confirmed:'已确认',paid:'已支付',shipped:'已发货',delivered:'已完成',cancelled:'已取消'};
try{var r=await API.put('/api/orders/'+id+'/status',{status:status});if(r.ok){toast('已转为 '+ns[status],'success');hideModal('order-modal');loadOrders();loadDashboard()}else{var d=await r.json();toast(d.detail||'操作失败','error')}}catch(e){toast(e.message,'error')}}

// ===== Refunds =====
async function loadRefunds(){
try{var r=await API.get('/api/refunds');var d=await r.json(),bs={pending:'bg-yellow',approved:'bg-green',rejected:'bg-red'},ns={pending:'待审批',approved:'已通过',rejected:'已驳回'};
var rows='',cnt=0;d.forEach(function(rf){rows+='<tr><td class="num">'+rf.id+'</td><td class="num">'+rf.order_id+'</td><td>'+T(rf.reason,30)+'</td><td style="font-weight:600">'+F(rf.amount)+'</td><td><span class="badge '+bs[rf.status]+'">'+ns[rf.status]+'</span></td><td>'+D(rf.created)+'</td><td class="flex">'+(user.role==='admin'&&rf.status==='pending'?'<button class="btn btn-success btn-sm" onclick="approveRefund(\''+rf.id+'\')">通过</button><button class="btn btn-danger btn-sm" onclick="rejectRefund(\''+rf.id+'\')">驳回</button>':'')+'</td></tr>';if(rf.status==='pending')cnt++});document.getElementById('refund-list').innerHTML=rows||'<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--muted)">暂无退款</td></tr>';
document.getElementById('nav-refund-badge').textContent=cnt;document.getElementById('nav-refund-badge').style.display=cnt?'inline':'none'}catch(e){if(e.message!=='401')console.error(e)}
}
function showRefundModal(){document.getElementById('refund-oid').value='';document.getElementById('refund-amount').value='';document.getElementById('refund-reason').value='';showModal('refund-modal')}
async function submitRefund(){var oid=document.getElementById('refund-oid').value,amt=document.getElementById('refund-amount').value,reason=document.getElementById('refund-reason').value;if(!oid){toast('请输入订单ID','error');return}
var body={order_id:oid,reason:reason};if(amt)body.amount=parseFloat(amt);
try{var r=await API.post('/api/refunds',body);if(r.ok){toast('退款申请已提交','success');hideModal('refund-modal');loadRefunds()}else{var d=await r.json();toast(d.detail||'申请失败','error')}}catch(e){toast(e.message,'error')}}
async function approveRefund(id){try{var r=await API.put('/api/refunds/'+id+'/approve');if(r.ok){toast('退款已通过','success');loadRefunds();loadDashboard()}else{var d=await r.json();toast(d.detail,'error')}}catch(e){toast(e.message,'error')}}
async function rejectRefund(id){try{var r=await API.put('/api/refunds/'+id+'/reject');if(r.ok){toast('已驳回','success');loadRefunds()}else{var d=await r.json();toast(d.detail,'error')}}catch(e){toast(e.message,'error')}}

// Init
if(!checkAuth()){document.getElementById('login-page').style.display='flex'}else{nav('dashboard')}
</script>
</body>
</html>
