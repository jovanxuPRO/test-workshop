name: Test Workshop Pro CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'api/**'
      - 'main.py'
      - 'ci-test-plan.json'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'   # 每日凌晨2点回归
    - cron: '0 8 * * 1'   # 每周一早8点全量
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API base URL'
        required: true
        default: 'http://staging:8000'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Start target service
        if: ${{ !contains(github.event.head_commit.message, '[dry-run]') }}
        run: |
          # 如果你的项目有 docker-compose，在这里启动
          # docker-compose up -d
          # sleep 5  # 等待服务就绪
          echo "Target service assumed running externally"

      - name: CI Check (Dry Run)
        if: ${{ contains(github.event.head_commit.message, '[dry-run]') || github.ref != 'refs/heads/main' }}
        run: |
          python main.py --run-config ci-test-plan.json --output-dir reports --dry-run

      - name: CI Full Test (Main branch only, needs target service)
        if: ${{ !contains(github.event.head_commit.message, '[dry-run]') && github.ref == 'refs/heads/main' }}
        run: |
          python main.py --run-config ci-test-plan.json --output-dir reports --headless

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-py${{ matrix.python-version }}
          path: reports/

      - name: Publish Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: reports/test-results.xml

      - name: Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Python | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ matrix.python-version }} | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

  deploy-report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4

      - name: Publish to Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: false
